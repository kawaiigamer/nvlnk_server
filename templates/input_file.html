<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fullscreen WAV selector</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        .full-form { display: flex; flex-direction: column; width: 100vw; height: 100vh; }
        .file-drop-zone { flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #f9f9f9; padding: 20px; }
        .file-label { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; border: 3px dashed #ccc; border-radius: 8px; cursor: pointer; background: #fff; transition: background 0.2s, border-color 0.2s; }
        .file-label:hover { background: #f0f7ff; border-color: #007bff; }
        .file-input { display: none; }
        .file-text { font-size: 24px; color: #555; text-align: center; font-weight: bold; pointer-events: none; }
        .file-subtext { font-size: 16px; color: #888; margin-top: 10px; pointer-events: none; }
        .full-button { width: 100%; height: 80px; background: #007bff; color: white; border: none; font-size: 24px; cursor: pointer; font-weight: bold; }
        .full-button:hover { background: #0056b3; }
        .full-button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <form class="full-form" id="uploadForm">
        <div class="file-drop-zone">
            <label class="file-label">
                <input type="file" name="file" class="file-input" id="fileInput" accept=".wav">
                <div class="file-text" id="fileName">Select WAV file</div>
                <div class="file-subtext">Or drop it</div>
            </label>
        </div>
        <button class="full-button" type="submit" id="submitBtn" disabled>Send</button>
    </form>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileName');
        const submitBtn = document.getElementById('submitBtn');
        const dropZone = document.querySelector('.file-label');


        function updateFileDisplay(file) {
           if (file) {
                fileNameDisplay.textContent = `Selected file name: ${file.name}`;
                submitBtn.disabled = false;
           } else {
                fileNameDisplay.textContent = 'Select WAV file';
                submitBtn.disabled = true;
            }
        }

    fileInput.addEventListener('change', function() {
        updateFileDisplay(this.files[0]);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#007bff';
            dropZone.style.background = '#f0f7ff';
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
             e.preventDefault();
             dropZone.style.borderColor = '#ccc';
             dropZone.style.background = '#fff';
        }, false);
    });

    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length > 0 && files[0].name.endsWith('.wav')) {
            fileInput.files = files;
            updateFileDisplay(files[0]);
        } else {
            alert('Select .wav file');
        }
    });


    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const file = fileInput.files[0];
        if (!file) return;
        submitBtn.disabled = true;
        fileNameDisplay.textContent = 'Decrypting...';

        fetch('/wav/text/aes256_N-FSK/decrypter', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/octet-stream',
                'X-File-Name': encodeURIComponent(file.name)
            },
            body: file
        })
        .then(response => {
            if (!response.ok) {
            return response.json().then(err => { throw new Error(err.error || 'Server error'); });
        }
        return response.blob();
    })
        .then(blob => {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'decrypted_result.txt';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            a.remove();
            fileNameDisplay.textContent = 'File saved!';
        })
        .catch(error => {
            console.error('Error:', error);
            alert(`Ошибка: ${error.message}`);
            updateFileDisplay(file);
        })
        .finally(() => {
            submitBtn.disabled = false;
        });
    });
    </script>
</body>
</html>
